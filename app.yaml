
# Deploy your app with
#
#    gcloud app deploy --project yourappid
#
# where "yourappid" is the actual id of your personal MyLife installation.

runtime: python312
app_engine_apis: true

# Single-user app: keep the footprint minimal so it stays in the App Engine free
# tier. Smallest instance class (F1, 256MB), and a single gunicorn worker -- a
# few threads is plenty for one user plus the occasional cron/task request, and
# 1 worker keeps memory well under F1's limit. --timeout 300 lets long
# export/import/Dropbox-backup requests finish instead of being killed at
# gunicorn's 30s default.
entrypoint: gunicorn -b :$PORT --timeout 300 --workers 1 --threads 4 main:app

instance_class: F1

# Scale to zero when idle (no always-on instance to pay for) and never run more
# than one instance -- a single user never needs concurrency across instances.
automatic_scaling:
  min_instances: 0
  max_instances: 1
  min_idle_instances: 0
  max_idle_instances: 1

inbound_services:
- mail

handlers:

- url: /css
  static_dir: css
  secure: always

- url: /js
  static_dir: js
  secure: always

- url: /robots\.txt
  static_files: robots.txt
  upload: robots\.txt
  secure: always

- url: .*
  script: auto
  login: admin
  secure: always
