
# Deploy your app with
#
#    gcloud app deploy --project yourappid
#
# where "yourappid" is the actual id of your personal MyLife installation.

runtime: python312
app_engine_apis: true

# py2.7 (gen1) was the web server itself and used threadsafe: true to dispatch
# concurrent requests onto threads automatically. py3 (gen2) makes us bring our
# own WSGI server. 2 workers x 8 threads restores thread concurrency cheaply;
# --timeout 120 keeps long export/import/backup requests from being killed at
# gunicorn's 30s default; --keep-alive 620 avoids a keepalive race with the
# nginx sidecar that causes sporadic 502s.
entrypoint: gunicorn -b :$PORT --timeout 120 --workers 2 --threads 8 --keep-alive 620 main:app

inbound_services:
- mail

handlers:

- url: /css
  static_dir: css
  secure: always

- url: /js
  static_dir: js
  secure: always

- url: /robots\.txt
  static_files: robots.txt
  upload: robots\.txt
  secure: always

- url: .*
  script: auto
  login: admin
  secure: always
